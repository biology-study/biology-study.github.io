<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jcks0n’s website!!!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Karla:wght@400;700&display=swap');

    body {
      font-family: 'Karla', sans-serif;
      background: radial-gradient(circle at center, #0a0015, #000000 90%);
      color: #cfcfff;
      margin: 0;
      padding: 2rem;
      line-height: 1.6;
    }

    h1 {
      text-align: center;
      font-family: 'Cinzel Decorative', cursive;
      font-size: 3rem;
      color: #a366ff;
      text-shadow: 0 0 12px #a366ff, 0 0 25px #5500aa;
      margin-bottom: 0.5rem;
    }

    .skullkid-img {
      display: block;
      margin: 0 auto 1rem auto;
      width: 180px;
      filter: drop-shadow(0 0 20px #55ff99) drop-shadow(0 0 10px #5500aa);
      transition: transform 0.3s ease;
    }

    .skullkid-img:hover {
      transform: scale(1.05) rotate(-3deg);
    }

    nav {
      text-align: center;
      margin-top: 1.5rem;
    }

    nav a {
      display: inline-block;
      margin: 0.5rem 1rem;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      text-decoration: none;
      background: linear-gradient(135deg, #220033, #6600cc);
      color: #eee;
      box-shadow: 0 0 10px rgba(102, 0, 204, 0.7);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    nav a:hover {
      transform: scale(1.1);
      box-shadow: 0 0 15px #9900ff, 0 0 30px #440099;
    }

    section {
      max-width: 700px;
      margin: 3rem auto;
      padding: 1.5rem;
      background: rgba(10, 0, 30, 0.85);
      border-radius: 12px;
      box-shadow: 0 4px 25px rgba(85, 0, 170, 0.5);
      backdrop-filter: blur(4px);
    }

    section h2 {
      margin-top: 0;
      color: #b499ff;
      border-bottom: 2px solid #330044;
      padding-bottom: 0.5rem;
    }

    .update {
      margin-bottom: 1rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid #330044;
    }

    .update strong {
      color: #ddd;
    }

    .update small {
      display: block;
      color: #aaa;
    }
  </style>
</head>
<body>
  <!-- Skull Kid image -->
  <img
    src="skullkid.png"
    alt="Skull Kid"
    class="skullkid-img"
  />

  <h1>jcks0n’s website!!!</h1>

  <nav>
    <a href="manga/index.html">Manga</a>
    <a href="games/index.html">Games</a>
  </nav>

  <section id="updates">
    <h2>website updates</h2>

    <div class="update">
      <strong>update #8</strong>
      <small>November 20th, 2025</small>
      <p>added csm volumes 20-22. fixing sonic mania over weekend</p>
    </div>

    <!-- Add new updates here -->
  </section>
</body>
</html>
