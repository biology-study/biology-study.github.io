<!DOCTYPE html>
<html>
<head>
    <title>Pokémon Emerald EmulatorJS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }
        #game {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>
    <div id="game"></div>

    <script>
        const romFile = "pokemr.gba";      // Pokémon Emerald ROM
        const biosFile = "gba_bios.bin";    // BIOS in root folder
        const enableDebug = false;
        const enableThreads = false;

        async function runGame() {
            window.EJS_player = "#game";
            window.EJS_gameName = "Pokémon Emerald";
            window.EJS_biosUrl = biosFile;      
            window.EJS_gameUrl = romFile;
            window.EJS_core = "gba";
            window.EJS_pathtodata = "data/";    
            window.EJS_startOnLoaded = true;
            window.EJS_DEBUG_XX = enableDebug;
            window.EJS_disableDatabases = true;
            window.EJS_threads = enableThreads;

            const script = document.createElement("script");
            script.src = "data/loader.js";       
            document.body.appendChild(script);
        }

        runGame();

        // Resize the game canvas if the window resizes
        window.addEventListener("resize", () => {
            const gameDiv = document.getElementById("game");
            gameDiv.style.width = window.innerWidth + "px";
            gameDiv.style.height = window.innerHeight + "px";
        });
    </script>
</body>
</html>
