<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, minimum-scale=1, maximum-scale=1">
  <title>Balatro</title>

  <link rel="stylesheet" type="text/css" href="theme/love.css">
  <script src="consolewrapper.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #0b5675;
    }
    #loadingCanvas, #canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>

  <canvas id="loadingCanvas" oncontextmenu="event.preventDefault()"></canvas>
  <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

  <script type="text/javascript">
    const loadingCanvas = document.getElementById("loadingCanvas");
    const loadingContext = loadingCanvas.getContext('2d');
    const gameCanvas = document.getElementById("canvas");

    // Resize both canvases to fill the window
    function resizeCanvas() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      gameCanvas.width = width;
      gameCanvas.height = height;

      loadingCanvas.width = width;
      loadingCanvas.height = height;
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', () => {
      resizeCanvas();
      window.focus();
    });

    function drawLoadingText(text) {
      const canvas = loadingContext.canvas;
      loadingContext.fillStyle = "rgb(142, 195, 227)";
      loadingContext.fillRect(0, 0, canvas.width, canvas.height);

      loadingContext.font = '2em Arial';
      loadingContext.textAlign = 'center';
      loadingContext.fillStyle = "rgb(11, 86, 117)";
      loadingContext.fillText(text, canvas.width / 2, canvas.height / 2);
    }

    window.addEventListener("keydown", function(e) {
      if([32,37,38,39,40].indexOf(e.keyCode) > -1) e.preventDefault();
    }, false);

    var Module = {
      arguments: ["./game.love"],
      INITIAL_MEMORY: 256000000,
      printErr: console.error.bind(console),
      canvas: gameCanvas,
      setStatus: function(text) {
        if (text) drawLoadingText(text);
        else if (Module.remainingDependencies === 0) {
          loadingCanvas.style.display = 'none';
          gameCanvas.style.visibility = 'visible';
        }
      },
      totalDependencies: 0,
      remainingDependencies: 0,
      monitorRunDependencies: function(left) {
        this.remainingDependencies = left;
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
      }
    };

    Module.setStatus('Downloading...');

    window.onerror = function(event) {
      Module.setStatus('Exception thrown, see JavaScript console');
      Module.setStatus = function(text) {
        if (text) Module.printErr('[post-exception status] ' + text);
      };
    };

    function applicationLoad(e) { Love(Module); }

  </script>

  <script type="text/javascript" src="game.js"></script>
  <script async type="text/javascript" src="love.js" onload="applicationLoad(this)"></script>

</body>
</html>
