<!DOCTYPE html>
<html>
<head>
    <title>EmulatorJS - Upload ROM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body, html {
            height: 100%;
            background-color: black;
            color: white;
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 15px;
            font-family: sans-serif;
        }
        #display { 
            width: 100%; 
            height: 100%; 
        }
        input[type="file"] {
            color: white;
        }
    </style>
</head>

<body>

    <h2 id="uploadTitle">Upload a ROM to Play</h2>

    <input 
        type="file" 
        id="romInput" 
        accept=".gba,.gb,.gbc,.nes,.smc,.sfc,.z64,.n64,.bin,.rom"
    >

    <div id="display"></div>

    <script>
        document.getElementById("romInput").addEventListener("change", function (event) {
            const file = event.target.files[0];
            if (!file) return;

            // Hide upload UI after ROM is chosen
            document.getElementById("romInput").style.display = "none";
            document.getElementById("uploadTitle").style.display = "none";

            const ext = file.name.split(".").pop().toLowerCase();

            // Detect emulator core
            let core = "gba";
            if (["smc", "sfc"].includes(ext)) core = "snes";
            if (["nes"].includes(ext)) core = "nes";
            if (["z64", "n64"].includes(ext)) core = "n64";
            if (["gb", "gbc"].includes(ext)) core = "gb";

            // Create local blob URL
            const romURL = URL.createObjectURL(file);

            // Replace display area with emulator container
            document.getElementById("display").innerHTML = `<div id="game"></div>`;

            // EmulatorJS configuration
            window.EJS_player = "#game";
            window.EJS_gameName = file.name;
            window.EJS_gameUrl = romURL;
            window.EJS_core = core;
            window.EJS_biosUrl = "";
            window.EJS_pathtodata = "data/";
            window.EJS_startOnLoaded = true;
            window.EJS_disableDatabases = true;

            // Load EmulatorJS loader
            const script = document.createElement("script");
            script.src = "data/loader.js";
            document.body.appendChild(script);
        });
    </script>

</body>
</html>
