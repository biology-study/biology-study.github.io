<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scrollable EPUB Viewer</title>
  <script src="https://unpkg.com/epubjs/dist/epub.min.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; background-color: #0b0b0b; color: white; }
    #viewer {
      width: 100%;
      height: 100vh;
      overflow-y: scroll;
      padding: 20px;
      box-sizing: border-box;
    }
    img { max-width: 100%; height: auto; }
    select { background-color: #1a1a1a; color: white; border: none; padding: 6px 10px; border-radius: 6px; margin: 10px; }
  </style>
</head>
<body>
  <select id="bookSelect">
    <option value="jjkln1.epub">Jujutsu Kaisen: Summer of Ashes, Autumn of Dust</option>
    <option value="jjkln2.epub">Jujutsu Kaisen: Thorny Road At Dawn</option>
  </select>
  <div id="viewer"></div>

  <script>
    const viewer = document.getElementById('viewer');

    async function loadBook(path) {
      viewer.innerHTML = '';
      const response = await fetch(path);
      const arrayBuffer = await response.arrayBuffer();
      const book = ePub(arrayBuffer);

      const rendition = book.renderTo(viewer, {
        width: '100%',
        height: 'auto',
        flow: 'scrolled-doc',
        spread: 'none'
      });

      await rendition.display();
    }

    document.getElementById('bookSelect').onchange = (e) => loadBook(e.target.value);
  </script>
</body>
</html>
