<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Light Novel Reader</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/epubjs/dist/epub.min.js"></script>

<style>
  body {
    margin: 0;
    background: #0b0b0b;
    color: white;
    font-family: Georgia, serif;
  }
  #viewer {
    width: 100vw;
    height: 100vh;
  }
  .topbar {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 20;
    display: flex;
    gap: 10px;
  }
  select {
    padding: 6px 10px;
    border-radius: 6px;
    border: 0;
    background: white;
    font-size: 16px;
  }
</style>
</head>
<body>

<div class="topbar">
  <select id="novelSelect">
    <option value="jjkln1.epub">Light Novel 1</option>
    <option value="jjkln2.epub">Light Novel 2</option>
  </select>

  <select id="chapterSelect"></select>
</div>

<div id="viewer"></div>

<script>
let book, rendition;
const viewer = document.getElementById("viewer");
const chapterSelect = document.getElementById("chapterSelect");

// Load an EPUB using EPUB.js
function loadBook(path) {
  if (rendition) {
    rendition.destroy();
  }

  book = ePub(path);
  rendition = book.renderTo("viewer", {
    width: "100%",
    height: "100%",
    spread: "none",
    flow: "scrolled",
  });

  rendition.display();

  // When the book is ready, load chapters
  book.loaded.nav.then(nav => {
    chapterSelect.innerHTML = "";
    nav.toc.forEach((chapter, i) => {
      const opt = document.createElement("option");
      opt.value = chapter.href;
      opt.textContent = chapter.label || `Chapter ${i + 1}`;
      chapterSelect.appendChild(opt);
    });
  });
}

// Jump to chapter
chapterSelect.onchange = () => {
  const href = chapterSelect.value;
  rendition.display(href);
};

// Switching LN
document.getElementById("novelSelect").onchange = e => {
  loadBook(e.target.value);
};

// Load first LN on startup
loadBook("jjkln1.epub");
</script>

</body>
</html>
